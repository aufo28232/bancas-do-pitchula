name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint · typecheck · test · test:db · build · test:e2e · audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # contents: write só para (1) gravar package.json/lockfile fixados na primeira
      # execução (D-049) e (2) publicar a saída dos passos no branch `ci-logs`.
      contents: write
    services:
      # Redis de verdade + proxy REST compatível com a API do Upstash (D-059).
      redis:
        image: redis:7-alpine
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: token-local-de-teste
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      # Chaves de TESTE públicas da Cloudflare (sempre aprovam). Nunca usar em produção.
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: token-local-de-teste
      SITE_URL: http://localhost:3000
      DEPLOY_MODE: managed
      PLATFORM_NAME: 4fly
      PLATFORM_SIGNUP_URL: https://go.aff.4fly.game/3kxqo488
      NEXT_TELEMETRY_DISABLED: "1"
      LOGS: ${{ github.workspace }}/.ci-logs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Preparar pasta de logs
        run: mkdir -p "$LOGS"

      - name: Instalar pnpm (versão do packageManager, ou a mais recente na primeira execução)
        run: |
          set -o pipefail
          {
            PM=$(node -p "require('./package.json').packageManager || ''")
            if [ -n "$PM" ]; then npm install -g "$PM"; else npm install -g pnpm@latest; fi
            node --version
            pnpm --version
          } 2>&1 | tee "$LOGS/01-pnpm.log"

      - name: Fixar versões exatas (primeira execução ou pacote novo)
        id: pin
        run: |
          set -o pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            node scripts/pin-deps.mjs 2>&1 | tee "$LOGS/02-pin.log"
            echo "novo=1" >> "$GITHUB_OUTPUT"
          elif ! node scripts/deps-faltantes.mjs; then
            node scripts/pin-deps.mjs --faltantes 2>&1 | tee "$LOGS/02-pin.log"
            echo "novo=1" >> "$GITHUB_OUTPUT"
          else
            echo "novo=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        run: |
          set -o pipefail
          if [ "${{ steps.pin.outputs.novo }}" = "1" ]; then
            pnpm install --no-frozen-lockfile 2>&1 | tee "$LOGS/03-install.log"
          else
            pnpm install --frozen-lockfile 2>&1 | tee "$LOGS/03-install.log"
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local
        run: |
          set -o pipefail
          { supabase --version; supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta; } 2>&1 \
            | grep -viE 'key|secret|jwt|token' | tee "$LOGS/04-supabase-start.log"

      - name: Variáveis do Supabase local e chave HMAC efêmera para os testes
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DB_URL=${DB_URL}"
            echo "HMAC_KEYS={\"1\":\"$(openssl rand -base64 32)\"}"
            echo "HMAC_ACTIVE=1"
            echo "DATA_ENC_KEYS={\"1\":\"$(openssl rand -base64 32)\"}"
            echo "DATA_ENC_ACTIVE=1"
          } >> "$GITHUB_ENV"
          echo "variáveis exportadas (valores não são exibidos)"

      - name: pnpm lint
        run: set -o pipefail; pnpm lint 2>&1 | tee "$LOGS/05-lint.log"

      - name: pnpm typecheck
        run: set -o pipefail; pnpm typecheck 2>&1 | tee "$LOGS/06-typecheck.log"

      - name: pnpm test
        run: set -o pipefail; pnpm test 2>&1 | tee "$LOGS/07-test.log"

      - name: pnpm test:db
        run: set -o pipefail; pnpm test:db 2>&1 | tee "$LOGS/08-test-db.log"

      - name: pnpm build
        run: set -o pipefail; pnpm build 2>&1 | tee "$LOGS/09-build.log"

      - name: Instalar o Chromium do Playwright
        run: set -o pipefail; pnpm exec playwright install --with-deps chromium 2>&1 | tail -5 | tee "$LOGS/10-playwright-install.log"

      - name: pnpm test:e2e
        run: set -o pipefail; pnpm test:e2e 2>&1 | tee "$LOGS/10-test-e2e.log"

      - name: pnpm audit (sem vulnerabilidades altas)
        run: set -o pipefail; pnpm audit --audit-level high 2>&1 | tee "$LOGS/11-audit.log"

      - name: Gravar versões fixadas no repositório
        if: always() && steps.pin.outputs.novo == '1' && github.event_name != 'pull_request' && hashFiles('pnpm-lock.yaml') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml scripts/pinned-versions.md
          git commit -m "chore: fixar versões exatas das dependências e lockfile"
          git push

      - name: Diagnóstico do Supabase Auth em caso de falha (contas de teste apenas)
        if: failure()
        run: |
          docker ps --format '{{.Names}}' > "$LOGS/diag-containers.txt" || true
          AUTH=$(docker ps --format '{{.Names}}' | grep -m1 supabase_auth || true)
          if [ -n "$AUTH" ]; then
            docker logs "$AUTH" 2>&1 | grep -iE 'error|captcha|invalid|grant|status' | grep -viE 'jwt_secret|service_role' | tail -60 > "$LOGS/diag-auth.log" || true
          fi

      - name: Publicar saída dos passos no branch ci-logs
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "status=${{ job.status }}"
            date -u +"quando=%Y-%m-%dT%H:%M:%SZ"
          } > "$LOGS/00-resumo.txt"
          cd "$LOGS"
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "logs do CI ${{ github.run_id }} (${{ github.sha }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs

      - name: Parar Supabase
        if: always()
        run: supabase stop --no-backup || true
