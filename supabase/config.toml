# Configuração do Supabase LOCAL (supabase start). Em produção, os mesmos
# valores precisam ser aplicados no painel do projeto: ver README, "Supabase".

project_id = "bancas-do-pitchula"

[api]
enabled = true
port = 54321
# Único schema exposto no PostgREST: só funções (D-002). As tabelas ficam em `app`.
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
# JWT curto: a revogação é checada a cada requisição, e o Realtime cai quando expira (D-028).
jwt_expiry = 300
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Precisa ficar ligado para o login anônimo do espectador (D-003).
# O cadastro público é barrado NO BANCO por um trigger em auth.users (D-048):
# só o servidor, no seed e no aceite de convite, consegue criar conta com e-mail.
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 12

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
# true = provedor de e-mail LIGADO. Desligar aqui desliga também o LOGIN por e-mail.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[analytics]
enabled = false

[edge_runtime]
enabled = false
